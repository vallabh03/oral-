name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Secret scan (working tree + history)
        run: npm run audit:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, integration and security tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility and responsive tests
        run: npx playwright test
      - name: SEO release gate
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          SEO_BASE=http://localhost:3000 npm run audit:seo
        env:
          PGLITE_DIR: .data/ci-seo
          # Audit the site as it will be once indexing is approved (the default keeps every page noindex;
          # that safe mode is covered by tests/unit/seo.test.ts).
          INDEXING_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  container:
    # Builds the production image and runs it in production mode against a real PostgreSQL:
    # the migrate command (schema owner) provisions the DML-only app role, then the server
    # starts as that role. Proves the standalone server, native modules and ops scripts on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taoc_owner
          POSTGRES_PASSWORD: ci-owner-password # same as OPW below
          POSTGRES_DB: taoc
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U taoc_owner" --health-interval 5s --health-retries 20
    env:
      SITE: https://ci.invalid
      OPW: ci-owner-password # throwaway CI-only database passwords
      APW: ci-app-password
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=$SITE -t taoc:ci .
      - name: Migrate and provision app role
        run: |
          echo "AUDIT_HMAC_SECRET=$(openssl rand -hex 32)" >> ci.env
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> ci.env
          echo "NEXT_PUBLIC_SITE_URL=$SITE" >> ci.env
          echo "APP_ENV=production" >> ci.env
          docker run --rm --network host --env-file ci.env \
            -e DATABASE_URL="postgres://taoc_owner:$OPW@localhost:5432/taoc?sslmode=disable" \
            -e APP_DB_USER=taoc_app -e APP_DB_PASSWORD="$APW" taoc:ci migrate
      - name: Start server as the app role and smoke test
        run: |
          docker run -d --name taoc --network host --env-file ci.env \
            -e DATABASE_URL="postgres://taoc_app:$APW@localhost:5432/taoc?sslmode=disable" taoc:ci
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/api/health
          curl -sf -o /dev/null http://localhost:3000/
          # The app role must not be able to change the schema.
          ! PGPASSWORD="$APW" psql -h localhost -U taoc_app -d taoc -c "drop table audit_events"
      - name: Container logs
        if: always()
        run: docker logs taoc || true

  lightsail:
    # Runs the single-server production stack exactly as on the Lightsail server: PostgreSQL,
    # migrations + DML-only app role, the app, and Caddy serving HTTPS; then the ops scripts.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Write throwaway production settings
        run: |
          sudo mkdir -p /opt/taoc/backups
          {
            echo "SITE_DOMAIN=localhost"
            echo "SITE_ADDRESSES=localhost, www.localhost"
            echo "SITE_URL=https://localhost"
            echo "ALERT_EMAIL=ci@example.org"
            # A value with spaces, as setup.sh writes it (the ops scripts read this file with bash).
            echo 'NOTIFY_CLINIC_NAME="Telangana Against Oral Cancer"'
            for k in DB_OWNER_PASSWORD DB_APP_PASSWORD AUDIT_HMAC_SECRET DATA_ENCRYPTION_KEY; do echo "$k=$(openssl rand -hex 32)"; done
            echo "STORAGE_DRIVER=local"
          } | sudo tee /opt/taoc/.env >/dev/null
      - name: Build and start the stack
        working-directory: deploy/lightsail
        run: sudo docker compose --env-file /opt/taoc/.env up -d --build
      - name: Health check through Caddy (HTTPS)
        run: |
          for i in $(seq 1 90); do curl -skf https://localhost/api/health && break; sleep 2; done
          curl -skf https://localhost/api/health
          curl -skf -o /dev/null https://localhost/
          # www redirects permanently to the main address.
          test "$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' --resolve www.localhost:443:127.0.0.1 https://www.localhost/about)" = "301 https://localhost/about"
          # The database must not be reachable from outside the Docker network.
          ! timeout 3 bash -c "</dev/tcp/127.0.0.1/5432"
      - name: Create a staff account
        run: sudo deploy/lightsail/staff.sh ci-admin@example.org super_admin "CI Admin" | grep -q "token="
      - name: Backup and restore
        run: |
          sudo deploy/lightsail/backup.sh
          stamp=$(sudo ls /opt/taoc/backups | grep -o '^db-.*\.dump$' | sed 's/^db-//; s/\.dump$//' | tail -1)
          echo RESTORE | sudo deploy/lightsail/restore.sh "$stamp"
          for i in $(seq 1 60); do curl -skf https://localhost/api/health && break; sleep 2; done
          curl -skf https://localhost/api/health
      - name: Stack logs
        if: always()
        working-directory: deploy/lightsail
        run: sudo docker compose --env-file /opt/taoc/.env logs --tail 80

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - name: Synthesize every environment
        run: |
          for env in staging production; do npx cdk synth -c env=$env --quiet; done
