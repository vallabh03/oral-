name: Deploy

# This workflow deploys the AWS CDK/Fargate stack (docs/DEPLOYMENT.md). Production currently runs
# on Lightsail and is updated by hand with deploy/lightsail/update.sh, and no staging stack or
# GitHub→AWS role exists yet, so the automatic run after CI is switched off: every merge was
# recording a failed "staging" deployment for an environment that does not exist. Start it by hand
# (Actions → Deploy → Run workflow) once the stack and the OIDC role are provisioned; then restore
#   workflow_run: { workflows: [CI], types: [completed], branches: [main] }
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write # GitHub → AWS sign-in without stored keys (OIDC)

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.site_url }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-2' }}
      - name: Deploy (build image, migrate on start, rolling update with automatic rollback)
        id: deploy
        working-directory: infra
        run: |
          npx cdk deploy "Taoc-$DEPLOY_ENV" -c env="$DEPLOY_ENV" --require-approval never --outputs-file outputs.json
          echo "site_url=$(jq -r --arg s "Taoc-$DEPLOY_ENV" '.[$s].SiteUrl' outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
        run: |
          for i in $(seq 1 30); do curl -sf "$SITE_URL/api/health" && exit 0; sleep 10; done
          echo "::error::$SITE_URL/api/health did not become healthy"; exit 1
